[package]
name = "bricks-benchmark"
version = "0.1.0"
edition = "2024"
publish = false
description = "Benchmark suite for Bricks SDK tool I/O performance"

[dependencies]
bricks = { path = "../../crates/bricks" }
bricks-types = { path = "../../crates/bricks-types" }
bricks-tools = { path = "../../crates/bricks-tools" }
tokio = { version = "1.44", features = ["full"] }
serde_json = "1"
anyhow = "1"
tempfile = "3"
which = "7"
