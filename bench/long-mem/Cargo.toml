[package]
name = "longmem-bench"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Head-to-head LongMemEval benchmark for the Bricks memory stack"
publish = false

[[bin]]
name = "longmem-bench"
path = "src/main.rs"

[[bin]]
name = "longmem-recall"
path = "src/bin/longmem_recall.rs"

[dependencies]
bricks-types      = { workspace = true }
bricks-provider   = { workspace = true }
bricks-embeddings = { workspace = true }
bricks-memory     = { workspace = true, features = ["embed", "graph", "structured"] }
tokio-util        = { workspace = true }

tokio             = { workspace = true }
async-trait       = { workspace = true }
anyhow            = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
tracing           = { workspace = true }
tracing-subscriber = { workspace = true }
chrono            = { workspace = true }
clap              = { version = "4", features = ["derive"] }
tempfile          = { workspace = true }
