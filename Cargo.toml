[workspace]
resolver = "2"
exclude = ["examples/benchmark"]
members = [
    "crates/bricks",
    "crates/bricks-types",
    "crates/bricks-provider",
    "crates/bricks-tools",
    "crates/bricks-tools-derive",
    "crates/bricks-agent",
    "crates/bricks-memory",
    "crates/bricks-hooks",
    "crates/bricks-mcp",
    "crates/bricks-lsp",
    "crates/bricks-semantic",
    "crates/bricks-embeddings",
    "crates/bricks-compression",
    "crates/bricks-skills",
    "crates/bricks-vms",
    "crates/bricks-agentlang",
    "crates/bricks-agentrl",
    "crates/bricks-workflows",
    "crates/bricks-tbench",
    "crates/bricks-web",
    "crates/bricks-testkit",
    "bench/long-mem",
    "crates/bricks-cli",
    "crates/bricks-config",
    "apps/bricks-desktop/src-tauri",
]

[workspace.package]
version = "0.6.1"
edition = "2024"
authors = ["Adib Mohsin"]
license = "MPL-2.0"
description = "A modular Rust SDK for building coding agents"
repository = "https://github.com/ainsiparlaitzarathoustra/bricks"
homepage = "https://github.com/ainsiparlaitzarathoustra/bricks"
keywords = ["ai", "agent", "coding", "llm", "tools"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.44", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures = "0.3"
async-trait = "0.1"

# HTTP
# DNS: every client resolves through hickory (pure Rust), set by
# `bricks_types::http` — static musl binaries have no NSS for getaddrinfo.
# reqwest's own `hickory-dns` feature is not used: it pins hickory 0.25
# (RUSTSEC-2026-0118/0119); the shared resolver uses 0.26.
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "rustls-tls-webpki-roots"], default-features = false }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
glob = "0.3"
walkdir = "2"
ignore = "0.4.26"
tokei = { version = "15", default-features = false }
grep = "0.4.1"
tempfile = "3"
dirs = "5"
which = "7"
once_cell = "1"
parking_lot = "0.12"
dashmap = "6"
bytes = "1"
base64 = "0.22"
sha2 = "0.10"
url = "2"
httpdate = "1.0.3"

# Text processing
similar = "2"

# Process execution
nix = { version = "0.29", features = ["process", "signal", "user"] }

# JSON Schema
schemars = { version = "0.8", features = ["derive"] }

# Proc macro
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# Workspace crates
bricks = { path = "crates/bricks", version = "0.6.1" }
bricks-types = { path = "crates/bricks-types", version = "0.6.1" }
bricks-provider = { path = "crates/bricks-provider", version = "0.6.1" }
bricks-tools = { path = "crates/bricks-tools", version = "0.6.1" }
bricks-tools-derive = { path = "crates/bricks-tools-derive", version = "0.6.1" }
bricks-agent = { path = "crates/bricks-agent", version = "0.6.1" }
bricks-memory = { path = "crates/bricks-memory", version = "0.6.1" }
bricks-hooks = { path = "crates/bricks-hooks", version = "0.6.1" }
bricks-mcp = { path = "crates/bricks-mcp", version = "0.6.1" }
bricks-lsp = { path = "crates/bricks-lsp", version = "0.6.1" }
bricks-semantic = { path = "crates/bricks-semantic", version = "0.6.1" }
bricks-embeddings = { path = "crates/bricks-embeddings", version = "0.6.1" }
bricks-compression = { path = "crates/bricks-compression", version = "0.6.1" }
bricks-skills = { path = "crates/bricks-skills", version = "0.6.1" }
bricks-vms = { path = "crates/bricks-vms", version = "0.6.1" }
bricks-agentlang = { path = "crates/bricks-agentlang", version = "0.6.1" }
bricks-agentrl = { path = "crates/bricks-agentrl", version = "0.6.1" }
bricks-workflows = { path = "crates/bricks-workflows", version = "0.6.1" }
bricks-web = { path = "crates/bricks-web", version = "0.6.1" }
bricks-testkit = { path = "crates/bricks-testkit" }
bricks-config = { path = "crates/bricks-config", version = "0.6.1" }
clap = { version = "4.5", features = ["derive"] }
nucleo-matcher = "0.3"

[profile.release]
strip = true
lto = "thin"
opt-level = "z"
