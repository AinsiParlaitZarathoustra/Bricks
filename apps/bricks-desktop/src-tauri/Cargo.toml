[package]
name = "bricks-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bricks Desktop: the Tauri application over the Bricks engine."

[lib]
name = "bricks_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
bricks-config = { workspace = true }
bricks-skills = { workspace = true }
bricks-agent = { workspace = true }
bricks-mcp = { workspace = true }
bricks-provider = { workspace = true }
bricks-tools = { workspace = true }
bricks-types = { workspace = true }
bricks-memory = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
portable-pty = "0.9"
ignore = { workspace = true }
nucleo-matcher = { workspace = true }
ts-rs = { version = "11", features = ["serde-json-impl"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
toml_edit = "0.22"
sha2 = "0.10"

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString"] }
