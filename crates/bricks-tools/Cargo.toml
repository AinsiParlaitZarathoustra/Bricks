[package]
name = "bricks-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Tool trait, built-in tools, and permission system for the Bricks SDK"
readme = "../../README.md"

[dependencies]
bricks-types = { workspace = true }
bricks-mcp = { workspace = true }
bricks-lsp = { workspace = true }
bricks-semantic = { workspace = true }
bricks-skills = { workspace = true }
bricks-memory = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }
regex = { workspace = true }
glob = { workspace = true }
walkdir = { workspace = true }
tokei = { workspace = true }
encoding_rs_io = "0.1"
rayon = "1.10"
futures = { workspace = true }
which = { workspace = true }
nix = { workspace = true }
libc = "0.2"
tempfile = { workspace = true }
similar = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
bricks-web = { workspace = true }
bricks-compression = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
tree-sitter = "^0.26"
tree-sitter-bash = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
notify = { version = "8", optional = true }
portable-pty = { version = "0.9", optional = true }
base64 = "0.22"
tantivy = "0.26.2"
bricks-embeddings = { workspace = true }
bricks-vms = { workspace = true, optional = true }
ignore = { workspace = true }
grep = { workspace = true }

[features]
default = ["file-watch"]
pty = ["dep:portable-pty"]
file-watch = ["dep:notify"]
vms = ["dep:bricks-vms"]
