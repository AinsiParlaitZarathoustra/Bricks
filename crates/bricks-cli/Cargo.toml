[package]
name = "bricks-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `bricks` command: a thin layer that loads the configuration, starts the engine and presents its events as text or headless JSONL."

[[bin]]
name = "bricks"
path = "src/main.rs"
# Same doc output directory as the `bricks` facade library (target/doc/bricks):
# documenting this binary too makes `cargo doc --workspace` report a filename collision.
doc = false

[dependencies]
bricks-agent = { workspace = true }
bricks-config = { workspace = true }
bricks-types = { workspace = true }
bricks-provider = { workspace = true }
bricks-tools = { workspace = true }
bricks-memory = { workspace = true, features = ["structured"] }
bricks-embeddings = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
portable-pty = "0.9"
