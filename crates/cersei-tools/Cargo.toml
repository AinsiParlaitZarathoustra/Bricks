[package]
name = "cersei-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Tool trait, built-in tools, and permission system for the Cersei SDK"
readme = "../../README.md"

[dependencies]
cersei-types = { workspace = true }
cersei-mcp = { workspace = true }
cersei-lsp = { workspace = true }
bricks-semantic = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }
regex = { workspace = true }
glob = { workspace = true }
walkdir = { workspace = true }
which = { workspace = true }
nix = { workspace = true }
libc = "0.2"
tempfile = { workspace = true }
similar = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
cersei-web = { workspace = true }
cersei-compression = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
tree-sitter = "^0.26"
tree-sitter-bash = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
notify = { version = "8", optional = true }
portable-pty = { version = "0.9", optional = true }
base64 = "0.22"
tantivy = "0.26.2"
cersei-embeddings = { workspace = true }
cersei-vms = { workspace = true, optional = true }
ignore = { workspace = true }
grep = { workspace = true }

[features]
default = ["file-watch"]
pty = ["dep:portable-pty"]
file-watch = ["dep:notify"]
vms = ["dep:cersei-vms"]
