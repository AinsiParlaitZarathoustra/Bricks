[package]
name = "bricks-provider"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider trait and built-in LLM providers for the Bricks SDK"
readme = "../../README.md"

[dependencies]
bricks-types = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
httpdate = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
serde_path_to_error = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
