<h1>Glossaire multilingue</h1>
<p>Un « délai » (timeout) s'écrit タイムアウト en japonais et таймаут en russe. Les guillemets « » et les apostrophes ’ doivent être conservés tels quels.</p>
<p>Emoji et symboles : ⏱️ ≤ ≥ → €. Le texte arabe s'écrit de droite à gauche : مهلة.</p>
