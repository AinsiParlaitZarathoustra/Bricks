[package]
name = "bricks-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent builder, agentic loop, streaming, and reporters for the Bricks SDK"
readme = "../../README.md"

[dependencies]
bricks-types = { workspace = true }
bricks-provider = { workspace = true }
bricks-tools = { workspace = true }
bricks-semantic = { workspace = true }
bricks-skills = { workspace = true }
bricks-hooks = { workspace = true }
bricks-memory = { workspace = true }
bricks-mcp = { workspace = true }
bricks-compression = { workspace = true }
bricks-web = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
sha2 = { workspace = true }
dirs = { workspace = true }
serde_path_to_error = "0.1"
base64 = { workspace = true }
ignore = { workspace = true }

[features]
# Benchmark features — opt-in for general_agent_bench example.
jemalloc-bench = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
graph-bench    = ["bricks-memory/graph"]
bench-full     = ["jemalloc-bench", "graph-bench"]

[dependencies.tikv-jemallocator]
version  = "0.6"
optional = true

[dependencies.tikv-jemalloc-ctl]
version  = "0.6"
features = ["stats"]
optional = true

[dev-dependencies]
# Virtual time for the retry tests (no real multi-second waits).
tokio = { workspace = true, features = ["test-util"] }
bricks-embeddings = { workspace = true }
bricks-testkit = { workspace = true }
bricks-memory = { workspace = true, features = ["structured"] }
tokio-util = { workspace = true }
url = { workspace = true }
tracing-subscriber = { workspace = true }
regex = { workspace = true }

[[example]]
name = "general_agent_bench"
path = "benchmarks/general_agent_bench.rs"
